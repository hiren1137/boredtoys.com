name: Weekly net worth update

# Refreshes the "Spend X's Money" net worths from Forbes once a week and pushes them to main.
# The push itself triggers the Cloudflare Pages build, so no deploy hook secret is needed.
# If Forbes can't be reached or a figure looks wrong, the script keeps the old values and nothing is pushed.
on:
  schedule:
    - cron: '30 21 * * 1' # Mondays 21:30 UTC, after US markets close (3:00 AM IST Tuesday)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run update-net-worth
      - name: Commit and push if anything changed
        run: |
          if git diff --quiet; then
            echo "Net worths unchanged, nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update spend game net worths from Forbes"
          git push
