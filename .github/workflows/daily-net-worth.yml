name: Daily rebuild

# Rebuilds the Cloudflare Pages site once a day so spend games pick up fresh Forbes figures
# and games scheduled for the new day (publishedAt) go live.
# The Pages build command must be `npm run build:live`, which fetches the figures before building.
on:
  schedule:
    - cron: '30 21 * * *' # 21:30 UTC, after US markets close (3:00 AM IST)
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            # Skip instead of failing so a missing secret doesn't send a failure email every day.
            echo "::warning::Skipped: add the CLOUDFLARE_DEPLOY_HOOK repository secret to enable daily rebuilds."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK"
